name: E2E
# Supabase local efímero: tienda pública con el coste centinela de
# tests/fixtures/test-db.sql y recorridos autenticados del panel.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Cesta y checkout encendidos (P03) con un TPV simulado (P04): en
    # producción siguen apagados hasta conectar el TPV (DECISIONS §136–137).
    # 999008881 es el comercio de pruebas público de Redsys; el banco lo hacen
    # las pruebas (page.route) y la clave se genera en cada ejecución.
    # Cuenta de cliente (PLAN_CUENTA_CLIENTE) y formulario de contacto (A6.1)
    # encendidos; en producción siguen apagados hasta configurar el correo
    # (Auth, Google y Resend) y revisar la privacidad (DECISIONS §153).
    # Las pruebas crean muchos pedidos desde la misma IP: el freno de las
    # acciones públicas se apaga (nunca en producción; DECISIONS §160).
    # Analítica y publicidad (DECISIONS §179) con IDs de prueba: el aviso pide
    # el consentimiento y las pruebas sirven vacías las etiquetas de Google,
    # Meta y TikTok (tests/support/tracking.ts), así que no sale ninguna
    # petición a esas empresas. El resto de pruebas navega con todo rechazado.
    env:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-E2ETEST01
      NEXT_PUBLIC_GOOGLE_ADS_ID: AW-100000001
      NEXT_PUBLIC_GOOGLE_ADS_PURCHASE_LABEL: e2eCompra
      NEXT_PUBLIC_META_PIXEL_ID: '1000000000000001'
      NEXT_PUBLIC_TIKTOK_PIXEL_ID: CE2ETEST000000000001
      WEB_CHECKOUT: '1'
      CUSTOMER_ACCOUNTS: '1'
      CONTACT_FORM: '1'
      RATE_LIMITS: 'off'
      REDSYS_MERCHANT_CODE: '999008881'
      REDSYS_TERMINAL: '1'
      REDSYS_ENVIRONMENT: test
    steps:
      - name: Clave de firma de un solo uso para el TPV simulado
        run: echo "REDSYS_SECRET_KEY=$(openssl rand -base64 24)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - name: Datos de prueba con el coste centinela
        run: >-
          docker exec -i supabase_db_adhara-admin-delivery
          psql -U postgres -d postgres -v ON_ERROR_STOP=1
          < tests/fixtures/test-db.sql
      - run: pnpm build:local
      - run: pnpm exec playwright install --with-deps chromium
      - name: Tienda pública (390×844 y 1440×900)
        run: node scripts/local-env.ts pnpm test:e2e
        env:
          ADHARA_COST_SENTINEL: '1'
          AUDIT_SCREENSHOTS: '1'
      - name: Panel con sesión, MFA y roles
        run: pnpm test:e2e:local
        env:
          AUDIT_SCREENSHOTS: '1'
      - name: Accesibilidad (línea base de axe)
        if: always()
        run: node scripts/axe-report.ts >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      - name: Capturas y axe de la auditoría visual
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-visual
          path: audit-output/
          retention-days: 14
      - run: pnpm exec supabase stop --no-backup
        if: always()
