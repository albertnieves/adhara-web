name: Database
# En todas las PR, no solo en las que tocan supabase/: la protección de main
# exige los tres workflows y un filtro por rutas dejaría la comprobación
# pendiente para siempre en las demás.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db reset --local
      - run: pnpm test:db
      - run: node scripts/check-db-types.ts
      - run: node scripts/check-db-lint.ts
      - run: node scripts/test-concurrency.ts
      - run: pnpm exec supabase stop --no-backup
        if: always()
