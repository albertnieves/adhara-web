<!-- Alta de la cuenta de cliente (PLAN_CUENTA_CLIENTE): /auth/confirm
     verifica el token y vuelve a next, la cuenta en su idioma. -->
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next={{ .RedirectTo }}"
    >Confirmar la cuenta · Confirmar el compte · Confirm your account</a
  >
</p>
<p>
  Si no has creado una cuenta en L’Atelier du Désert, ignora este correo. · Si
  no has creat cap compte a L’Atelier du Désert, ignora aquest correu. · If you
  didn't create an account at L’Atelier du Désert, ignore this email.
</p>
